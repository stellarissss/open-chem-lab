[project]
name = "st-solver-worker"
version = "0.1.0"
description = "动态定量求解 worker（当前为常驻进程骨架，求解逻辑按切片接入）"
requires-python = ">=3.11,<3.12"
# 当前不引入重依赖；求解器（phreeqpython/scipy/chempy/cantera）按内容 schema 与黄金用例逐个锁定版本后加入。
dependencies = []

[project.scripts]
st-solver-worker = "st_solver_worker.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/st_solver_worker"]
