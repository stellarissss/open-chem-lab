<!doctype html><html><head><meta charset="utf-8"><title>PENDING</title>
<style>html,body{margin:0}#viewer{width:320px;height:320px;position:relative;background:#ffffff}</style></head><body>
<div id="viewer"></div>
<script src="3dmol-min.js"></script>
<script>
var r={};
try{
  r.lib = typeof $3Dmol!=='undefined';
  // 咖啡因（真实 MOL/SDF 用 XYZ 近似）+ 苯环，覆盖"球棍"与"晶体/多原子"两类
  var ethanol = '9\nethanol\nC  0.0000  0.0000  0.0000\nC  1.5200  0.0000  0.0000\nO  2.0200  1.3300  0.0000\nH -0.3900 -0.5100  0.8900\nH -0.3900  1.0200 -0.1300\nH -0.3900 -0.5100 -0.8900\nH  1.9100 -0.5100  0.8900\nH  1.9100 -0.5100 -0.8900\nH  2.9400  1.2600  0.0000';
  var glViewer = $3Dmol.createViewer(document.getElementById('viewer'),{backgroundColor:'white'});
  r.viewerCreated = !!glViewer;
  // WebGL renderer 是否真正实例化（createViewer 内部会 new GLViewer → 需要 WebGL）
  r.hasWebGL = !!(glViewer && glViewer.renderer && glViewer.renderer.context);
  r.rendererCtxType = glViewer && glViewer.renderer ? typeof glViewer.renderer : 'null';
  // 解析 + 建模
  var m = glViewer.addModel(ethanol,'xyz');
  r.modelAdded = !!m;
  r.atomCount = m ? m.selectedAtoms({}).length : null;
  glViewer.setStyle({}, {stick:{radius:0.15}, sphere:{scale:0.3}});
  glViewer.zoomTo();
  glViewer.render();
  r.renderCalled = true;
  // 读回中心像素，确认不是纯背景（球棍几何应覆盖部分像素）
  var canv = document.querySelector('#viewer canvas');
  r.canvasFound = !!canv;
  if(canv){
    r.canvasW = canv.width; r.canvasH = canv.height;
    try{
      var c2 = document.createElement('canvas'); c2.width=canv.width;c2.height=canv.height;
      var ctx=c2.getContext('2d'); ctx.drawImage(canv,0,0);
      var img=ctx.getImageData(0,0,canv.width,canv.height).data;
      var nonWhite=0;
      for(var i=0;i<img.length;i+=4){ if(img[i]<245||img[i+1]<245||img[i+2]<245) nonWhite++; }
      r.nonWhitePixels = nonWhite;
      r.hasGeometry = nonWhite > 100;
    }catch(e){r.readbackErr=String(e).slice(0,120)}
  }
  r.ok=true;
}catch(e){r.ok=false;r.err=String(e).slice(0,200)}
document.title='RESULT='+JSON.stringify(r);
</script></body></html>
