<!doctype html><html><head><meta charset="utf-8"><title>PENDING</title></head><body>
<script>
var c=document.createElement('canvas');c.width=200;c.height=200;
var gl=c.getContext('webgl2')||c.getContext('webgl');
var r={};
if(gl){
  r.ok=true;r.version=gl.getParameter(gl.VERSION);
  var d=gl.getExtension('WEBGL_debug_renderer_info');
  r.renderer=d?gl.getParameter(d.UNMASKED_RENDERER_WEBGL):gl.getParameter(gl.RENDERER);
  r.clearDepth=typeof gl.clearDepth;
  gl.clearColor(0.2,0.4,0.8,1.0);gl.clear(gl.COLOR_BUFFER_BIT);
  var px=new Uint8Array(4);gl.readPixels(100,100,1,1,gl.RGBA,gl.UNSIGNED_BYTE,px);
  r.pixel=[px[0],px[1],px[2],px[3]];r.pixelNonBlack=(px[0]+px[1]+px[2])>0;
}else{r.ok=false;}
document.title='RESULT='+JSON.stringify(r);
</script></body></html>
