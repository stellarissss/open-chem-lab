# 文档与合规 CI（轻量）
# 校验现行文档结构、LGPL-3.0 交付与静态合规红线。
name: docs-and-compliance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验现行核心文档结构
        run: |
          test -f AGENTS.md
          test -f README.md
          test -f CREDITS.md
          test -f NOTICE
          test -f docs/01-Architecture.md
          test -f docs/02-Roadmap.md
          test -f docs/03-DocDD-Process.md
          test -f docs/specs/spec-001-骨架搭建.md
          test -f deploy/README-windows.md
          echo "AI 入口 + 三份权威文档 + 当前切片规格齐全"

      - name: 校验 LGPL-3.0 双文本许可证交付
        run: |
          test -f LICENSE
          test -f LICENSE.GPL-3
          test -f LICENSE.LGPL-3
          head -8 LICENSE.GPL-3 | grep -q "GNU GENERAL PUBLIC LICENSE"
          head -8 LICENSE.LGPL-3 | grep -q "GNU LESSER GENERAL PUBLIC LICENSE"
          grep -q "LICENSE.GPL-3" NOTICE
          grep -q "LICENSE.LGPL-3" NOTICE
          if head -8 LICENSE | grep -qi "Apache License"; then
            echo "::error::主许可证回退为 Apache-2.0"; exit 1
          fi
          echo "LGPL-3.0 双文本与显著声明齐全"

      - name: 静态合规红线检查
        run: |
          echo "白名单：MIT / BSD / Apache-2.0 / ISC / CC0 / CC-BY / LGPL-2.1 / LGPL-3.0；禁止 AGPL / GPLv2-only"
          if find . -path ./.git -prune -o \( -name 'tikz-chemlab.sty' -o -name 'tikz-chemlabObj.tex' -o -name 'tikz-chemlab.tex' \) -print | grep -q .; then
            echo "::error::检测到 tikz-chemlab 宏包源码（LPPL 边界）"; exit 1
          fi
          grep -q '^.env' .gitignore && grep -q 'data-thirdparty/' .gitignore
          if grep -rIl --exclude-dir=.git -E 'ghp_[A-Za-z0-9]{20,}' . | grep -q .; then
            echo "::error::检测到疑似明文 GitHub token"; exit 1
          fi
          echo "静态合规检查通过"

      - name: 资产署名清单格式检查
        run: |
          test -f assets/attribution/ASSETS.csv
          head -1 assets/attribution/ASSETS.csv | grep -q 'asset_id,source_project'
          echo "署名清单表头正确"

      - name: 文档纯净检查（单一状态 + 无过程痕迹 + 正向规格）
        run: python3 tools/doc-hygiene-check.py

      - name: 现行文档内部链接检查
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --exclude 'https://nobook.com|https://hx.nobook.com'
            AGENTS.md README.md CONTRIBUTING.md CREDITS.md 'docs/01-Architecture.md' 'docs/02-Roadmap.md' 'docs/03-DocDD-Process.md' 'docs/specs/**/*.md'
          fail: true
        continue-on-error: true

# ---- 按切片逐步接入的产品级门禁 ----
#   license-scan（依赖树白名单）/ lgpl-link-check（reaktoro-service 镜像）
#   schema-validate / rule-lint / golden-cases（数值零错）/ build / e2e / dual-platform
