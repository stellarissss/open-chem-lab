# 构建 + 依赖许可证门禁；文档合规门禁在 docs.yml。
# 数值零错/golden-cases/schema-validate 已接入（见 01-Architecture.md §7.2）。
# 按 03-DocDD-Process.md §四：任务内只跑最小充分证据，本 CI 是 push/PR 强制门禁，红灯阻塞合并。
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 全量构建（protocol 类型生成 + gateway/web-ui 编译）
        run: pnpm build

  content-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装 jsonschema
        run: pip install jsonschema==4.26.0
      - name: 内容层 schema 校验与事实层护栏
        run: python3 tests/schema-validate/validate.py
      - name: 美术资产署名与存在性门禁（LPPL 输出物 + 逐资产署名 + 路径闭合）
        run: python3 tests/asset-attribution/check.py
      - name: UI-事实层一致性门禁（可取药品全部可玩）
        run: python3 tests/content-consistency/check.py
      - name: 物化链产物一致性（幂等）
        run: |
          python3 tools/materialize-rules.py
          git diff --exit-code content/materialized/ruleset.json

  solver-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装前端依赖（全链路验收需启动 gateway/tsx）
        run: pnpm install --frozen-lockfile
      - name: 安装 uv
        run: pip install uv==0.10.0
      - name: 按 lock 安装求解链（离线可复现版本）
        working-directory: packages/solver-worker
        run: uv sync --frozen
      - name: 证据自证门禁（声称的对拍工具须真调用、期望值须标独立来源）
        run: python3 tests/evidence-check/check.py

      - name: 中和体系求解链数值零错复核（活度口径对拍 + chempy + 出口三态 + SLA）
        run: |
          PYTHONPATH=packages/solver-worker/src \
          packages/solver-worker/.venv/bin/python tests/golden-cases/run.py | tee /tmp/golden.log
          grep -q '\[EVIDENCE chempy=' /tmp/golden.log || {
            echo "::error::对拍声称用 chempy，但运行输出无真实调用指纹"; exit 1; }

      - name: 部署可达 e2e（solver 绑定非回环，gateway 跨地址可调）
        run: packages/solver-worker/.venv/bin/python tests/e2e/deploy_reachability.py

      # M1 收口（spec-007）：全链路贯通 + 四类好玩载体证据 + 数值零加工，
      # 真实启动 gateway(tsx) + solver-worker，经 /api/v1/* 连续走通五个环节。
      - name: 全链路集成验收 e2e（spec-007）
        run: packages/solver-worker/.venv/bin/python tests/e2e/full_pipeline.py

      # M2（用户裁决）：报告汇编门禁——数值零加工、来源闭合、三态如实、幂等。
      - name: 报告汇编门禁（spec-006 契约）
        run: |
          PYTHONPATH=packages/solver-worker/src \
          packages/solver-worker/.venv/bin/python tests/report/check.py

  license-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 依赖许可证白名单门禁
        run: python3 tests/license-scan/scan.py

  # M1 收口（spec-007）：容器构建可达。本地 workspace 完整安装会掩盖 Dockerfile
  # 的 COPY 遗漏（wasm-view 源码 / assets SVG / golden-cases），此门禁在干净构建
  # 上下文中真实构建三服务镜像并校验 compose 配置，防止双平台部署回归。
  deploy-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 校验 compose 配置（双平台共用的相对路径 + LF）
        run: docker compose -f deploy/docker-compose.minimal.yml config -q
      - name: 构建三服务镜像（干净构建上下文，验证 COPY 闭合）
        run: docker compose -f deploy/docker-compose.minimal.yml build gateway solver-worker web
      - name: 起服并验收容器全链路（健康检查 + 网关求解/报告 + 错误操作）
        run: |
          cp deploy/.env.example deploy/.env
          docker compose -f deploy/docker-compose.minimal.yml up -d
          python3 tests/e2e/docker_reachability.py
          docker compose -f deploy/docker-compose.minimal.yml down -v
