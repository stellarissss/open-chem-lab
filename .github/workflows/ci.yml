# 构建 + 依赖许可证门禁；文档合规门禁在 docs.yml。
# 数值零错/golden-cases/schema-validate 已接入（见 01-Architecture.md §7.2）。
# 按 03-DocDD-Process.md §四：任务内只跑最小充分证据，本 CI 是 push/PR 强制门禁，红灯阻塞合并。
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 全量构建（protocol 类型生成 + gateway/web-ui 编译）
        run: pnpm build

  content-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装 jsonschema
        run: pip install jsonschema==4.26.0
      - name: 内容层 schema 校验与事实层护栏
        run: python3 tests/schema-validate/validate.py
      - name: 美术资产署名与存在性门禁（LPPL 输出物 + 逐资产署名 + 路径闭合）
        run: python3 tests/asset-attribution/check.py
      - name: UI-事实层一致性门禁（可取药品全部可玩）
        run: python3 tests/content-consistency/check.py
      - name: 物化链产物一致性（幂等）
        run: |
          python3 tools/materialize-rules.py
          git diff --exit-code content/materialized/ruleset.json

  solver-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装 uv
        run: pip install uv==0.10.0
      - name: 按 lock 安装求解链（离线可复现版本）
        working-directory: packages/solver-worker
        run: uv sync --frozen
      - name: 证据自证门禁（声称的对拍工具须真调用、期望值须标独立来源）
        run: python3 tests/evidence-check/check.py

      - name: 中和体系求解链数值零错复核（活度口径对拍 + chempy + 出口三态 + SLA）
        run: |
          PYTHONPATH=packages/solver-worker/src \
          packages/solver-worker/.venv/bin/python tests/golden-cases/run.py | tee /tmp/golden.log
          grep -q '\[EVIDENCE chempy=' /tmp/golden.log || {
            echo "::error::对拍声称用 chempy，但运行输出无真实调用指纹"; exit 1; }

      - name: 部署可达 e2e（solver 绑定非回环，gateway 跨地址可调）
        run: packages/solver-worker/.venv/bin/python tests/e2e/deploy_reachability.py

  license-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 依赖许可证白名单门禁
        run: python3 tests/license-scan/scan.py
